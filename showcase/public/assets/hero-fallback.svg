<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">PromisePatch: six promises after a failed raspberry delivery, settled under deterministic authority</title>
<desc id="d">A raspberry delivery was not received. Of six accepted orders, four are reached. Order A is in the AUTO lane and was recovered under existing permission. Order B is in the ASK lane: the customer approved on a signed link, the approval passed a revalidation gate of ten checks against a fresh snapshot, and B was recovered. Orders C and D are BLOCKED and went to the owner with scheduled work held. Orders E and F are UNAFFECTED, were never reached, and stayed untouched.</desc>
