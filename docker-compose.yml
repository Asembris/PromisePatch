# The disposable local stack.
#
#                                                            ┌──▶  api  ──healthy──▶  frontend
#     postgres  ──healthy──▶  migrate  ──exit 0──▶  seed  ────┤
#                                                            └──▶  worker
#
#     order-simulator ────signed webhook────▶  api
#                     ◀───order amendment───
#
# The order system is a separate service on purpose, and it is separate in every way that
# matters: its own image, its own process, its own SQLite volume, its own published port and
# its own window. It shares no environment file with PromisePatch and holds no PostgreSQL
# credential. The only thing between them is the `order-contract` distribution and two HTTP
# calls, one in each direction.
#
# Every arrow is a condition rather than a hope. `depends_on` with `service_healthy` and
# `service_completed_successfully` is what makes "the stack is up" mean the schema is at head
# and the fixture is loaded: a failed migration leaves the API unstarted instead of leaving a
# healthy-looking process serving an empty or half-migrated database.
#
# **Privilege separation is the shape of this file.** There is no shared environment. The
# administrative connection reaches `migrate` and `seed`; the runtime connection reaches
# `api`; the frontend receives neither, because everything a `VITE_`-prefixed variable holds is
# compiled into a bundle any visitor can read. No connection string, credential or hostname is
# interpolated from the repository's own `.env` either -- a developer whose `.env` points at a
# hosted database must not be able to migrate it by typing `docker compose up`. The single
# interpolated value is `PROMISEPATCH_POSTGRES_PUBLISHED_PORT`, which chooses which host port
# this machine publishes the database on. A port number cannot name another database, so it
# carries none of the risk the rule above exists to prevent.
#
# Generate the environment files first:
#
#     uv run python scripts/bootstrap_local_env.py
#
# This database is a throwaway volume on one machine. It is not a model of a deployment.

name: promisepatch

services:
  postgres:
    image: postgres:16-alpine
    env_file: [docker/env/postgres.env]
    ports:
      # A high host port on purpose: 5432 is very often already taken by a locally installed
      # PostgreSQL, and a stack that silently connected to that one instead would be a
      # migration run against the wrong database.
      #
      # Overridable because a high port is not always an available one. Windows reserves
      # blocks of the ephemeral range for Hyper-V and WinNAT, the blocks move when the host
      # reboots, and a machine whose reservation has swallowed 55432 cannot bind it at all
      # (`netsh interface ipv4 show excludedportrange protocol=tcp`). Set
      # `PROMISEPATCH_POSTGRES_PUBLISHED_PORT` to move the published port; the default keeps
      # every machine that can bind 55432 exactly as it was. The container's own port never
      # moves, so nothing inside the network is affected.
      - "127.0.0.1:${PROMISEPATCH_POSTGRES_PUBLISHED_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory, before anything else touches the database. It
      # creates the login-less roles a managed host puts in front of its REST layer, so that
      # migration 0002's revocation of them is exercised here and not only in production.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-U`/`-d` matter: the default `pg_isready` answers about the server, and the server
      # accepts connections for a moment before `initdb` has finished creating this database.
      test: ["CMD-SHELL", "pg_isready -U postgres -d promisepatch"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  migrate:
    # The one place the backend image is built. `seed` and `api` run the same image with
    # different commands and different credentials.
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      secrets: [extra_ca]
    image: promisepatch-backend:local
    # Alembic, and only Alembic. The repository's migrations are the schema; there is no
    # `create_all()` path and no ad-hoc SQL that could put a database into a state no
    # migration describes.
    command: ["alembic", "-c", "apps/backend/alembic.ini", "upgrade", "head"]
    env_file: [docker/env/migrate.env]
    depends_on:
      postgres:
        condition: service_healthy
    # A migration that failed must stay failed and hold the rest of the stack back. Restarting
    # it would turn a schema error into a loop that eventually looks like a slow start.
    restart: "no"

  seed:
    # The same image as `migrate` and `api`, built once by `migrate`. Three build sections for
    # one tag would have three builders exporting the same name concurrently; `pull_policy` is
    # the other half of saying so, because a service with no build section is otherwise assumed
    # to come from a registry, and this image never does.
    image: promisepatch-backend:local
    pull_policy: never
    # The repository's own fixture path, not a copy of it: no SQL file, no shell script and no
    # duplicated demo data anywhere in this directory.
    command: ["pp", "reset-demo-state"]
    env_file: [docker/env/migrate.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: promisepatch-backend:local
    pull_policy: never
    env_file: [docker/env/api.env]
    ports:
      # High host ports throughout, for the reason given on the database: 8000 is a very
      # common default and a stack that quietly attached to something else already listening
      # there would be a confusing way to find out. Inside the network the API is `api:8000`,
      # which is what the frontend proxies to and what the healthcheck asks.
      - "127.0.0.1:58000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      # `/readyz`, not `/healthz`: liveness only says the process is running, and this gate
      # exists to say the database answers over the runtime role and the schema is the one
      # this build expects. Python rather than curl, so the image needs no extra package.
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=5)'
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 10s
    # Long enough for uvicorn's graceful shutdown to finish: the lifespan disposes the engine
    # pool and releases the listener's dedicated LISTEN connection, and a role with a small
    # connection budget should not have those reclaimed by timeout.
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    # The same image and the same credential as `api`. A worker holds no migration URL and no
    # `PP_ALLOW_FIXTURE_RESET`: it connects as `promisepatch_app`, so the audited write boundary
    # constrains it exactly as it constrains a request handler. Giving the process that runs
    # unattended more privilege than the one a human is watching would be precisely backwards.
    image: promisepatch-backend:local
    pull_policy: never
    command: ["pp", "worker"]
    env_file: [docker/env/api.env]
    depends_on:
      seed:
        condition: service_completed_successfully
    # No healthcheck and nothing to drain. A worker holds no server socket to probe, and
    # everything it is doing is a row: `SIGTERM` ends the current cycle, and a hard kill leaves
    # leases that expire. `restart: unless-stopped` is therefore a real recovery mechanism here
    # rather than a way of hiding a crash -- restarting is what recovery looks like.
    stop_grace_period: 20s
    restart: unless-stopped

  mcp:
    # The Streamable HTTP MCP endpoint: the surface a third-party MCP client -- or a real
    # Alexa+ registration -- would be pointed at.
    #
    # Its own service rather than a route on `api`, and that separation is the product's
    # authority boundary rather than tidiness. This container is given no database URL, and the
    # code in it cannot import `promisepatch.db` or `promisepatch.domain` at all; it reaches a
    # case by making an authenticated call to `api` like any other client would. Running it
    # inside the API process would put the domain on its import path and make the boundary a
    # convention.
    image: promisepatch-backend:local
    pull_policy: never
    command: ["pp", "mcp", "--host", "0.0.0.0", "--port", "8001"]
    env_file: [docker/env/mcp.env]
    ports:
      # High host port for the reason given on every other one here. Inside the network it is
      # `mcp:8001/mcp`, which is what an in-stack client uses; a deployment on AgentCore
      # Runtime binds the port that contract expects instead.
      - "127.0.0.1:58001:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # An unauthenticated POST, checked for exactly the answer an unauthenticated POST should
      # get. A 200 here would mean the bearer check was not in front of the protocol, so this
      # probe fails a server that came up *too* permissive rather than only one that is down.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          request = urllib.request.Request(
              "http://127.0.0.1:8001/mcp",
              data=b"{}",
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as answer:
              raise SystemExit(0 if answer.code == 401 else 1)
          raise SystemExit(1)
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped

  order-simulator:
    # The External Order System — simulator. Not Square, not a production point of sale, and
    # not a real customer system: a stand-in that owns demo order state so that a change made
    # *outside* PromisePatch can be watched arriving inside it.
    #
    # It does not depend on `seed` and it must not: it seeds its own store on boot, from its
    # own hand-authored order book, and a parity test in the backend suite is what keeps the
    # two datasets describing the same six orders. Waiting for PromisePatch's fixture would be
    # this system asking PromisePatch what its orders are.
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
      secrets: [extra_ca]
    image: promisepatch-order-simulator:local
    env_file: [docker/env/order-simulator.env]
    ports:
      # Its own high port, and deliberately far from the API's: on camera these are two
      # windows, and two systems that answered on adjacent ports would invite the reading that
      # they are one.
      - "127.0.0.1:58100:8100"
    volumes:
      # Its own volume. The SQLite file never goes anywhere near the PostgreSQL one -- the
      # whole claim of Proof A is that these two systems do not share storage.
      - order-simulator-data:/data
    healthcheck:
      # `/readyz`, not `/healthz`: readiness says the store is open and its order book is
      # loaded, which is what the browser suite needs before it can edit an order.
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8100/readyz", timeout=5)'
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 10s
    # Restarting is a real recovery mechanism here, not a way to hide a crash: an order event
    # committed before the process died is a row, and the delivery loop finds it on boot.
    stop_grace_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      secrets: [extra_ca]
    image: promisepatch-frontend:local
    environment:
      # The only configuration this container gets, and it is a routing decision rather than a
      # credential: where the dev server forwards `/api` and `/events`.
      VITE_DEV_API_PROXY_TARGET: http://api:8000
    ports:
      # 5173 is Vite's default and is very likely already in use on a machine that develops
      # this frontend -- including by this repository's own `npm run dev`. A stack that
      # answered on a port something else already owns would be a confusing way to find out.
      - "127.0.0.1:55173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:5173/").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  order-simulator-data:

secrets:
  extra_ca:
    # Build-time only, and empty by default: `bootstrap_local_env.py` creates the file so the
    # mount always resolves, and an empty one installs nothing. It exists for a machine whose
    # antivirus or corporate proxy terminates TLS with an issuer no base image trusts, where
    # the alternative is a stack that simply cannot be built.
    file: docker/env/extra-ca.crt
