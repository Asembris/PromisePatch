name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  GITLEAKS_VERSION: "8.21.2"
  NODE_VERSION: "24"

# Every job here tests something that exists. The engine and its static gates came first; the
# backend, the database and the frontend were added as each became real code that a change to
# another part of the repository could break. There is still no AWS or LLM job, because there
# is still nothing for one to test, and a job that always passes is worse than no job.
#
# Each database-backed job brings its own disposable PostgreSQL, on its own runner. Nothing
# here reaches a hosted database, and no two jobs share one -- the fixture reset truncates
# every table PromisePatch owns, and two suites doing that to one database would fail each
# other at random rather than report anything true.

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run mypy packages/promise-graph apps/backend

  tests:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: >
          uv run pytest packages/promise-graph
          --cov=promise_graph
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

  properties:
    name: hypothesis (ci profile)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run pytest packages/promise-graph/tests/properties

  imports:
    name: import-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run lint-imports

  backend:
    name: backend + postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages

      - name: Start a disposable PostgreSQL 16
        # Started here rather than declared as a service container so the credentials can be
        # generated for this run: a password written into this file would be a password in the
        # repository, and gitleaks would be right to say so. The init directory is the one the
        # local stack mounts, so the managed-host API roles exist here too and the revocation
        # of them in migration 0002 is exercised rather than skipped.
        run: |
          set -euo pipefail
          superuser_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          worker_password="$(openssl rand -hex 12)"
          owner_password="$(openssl rand -hex 12)"
          for secret in "$superuser_password" "$app_password" "$session_secret" \
                        "$worker_password" "$owner_password"; do
            echo "::add-mask::$secret"
          done

          docker run --detach --name pp-postgres \
            --env POSTGRES_PASSWORD="$superuser_password" \
            --env POSTGRES_DB=promisepatch \
            --volume "$PWD/docker/postgres/init:/docker-entrypoint-initdb.d:ro" \
            --publish 127.0.0.1:5432:5432 \
            postgres:16-alpine

          for _ in $(seq 1 60); do
            if docker exec pp-postgres pg_isready -U postgres -d promisepatch; then break; fi
            sleep 1
          done
          docker exec pp-postgres pg_isready -U postgres -d promisepatch

          address="127.0.0.1:5432/promisepatch"
          {
            echo "PP_ENV=local"
            echo "PP_MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:$superuser_password@$address"
            echo "PP_DATABASE_URL=postgresql+asyncpg://promisepatch_app:$app_password@$address"
            echo "PP_DB_APP_PASSWORD=$app_password"
            echo "PP_SESSION_SECRET=$session_secret"
            echo "PP_DEMO_WORKER_PASSWORD=$worker_password"
            echo "PP_DEMO_OWNER_PASSWORD=$owner_password"
            echo "PP_ALLOW_FIXTURE_RESET=true"
          } >> "$GITHUB_ENV"

      - name: Migrate an empty database to head
        run: uv run alembic -c apps/backend/alembic.ini upgrade head

      - name: The schema is the revision this build was written against
        run: |
          uv run alembic -c apps/backend/alembic.ini current
          uv run alembic -c apps/backend/alembic.ini check

      # One process, no parallelism: several of these tests reload the fixture, which
      # truncates every table PromisePatch owns.
      - name: Backend suite, integration tests included
        run: uv run pytest apps/backend

      - name: PostgreSQL logs
        if: failure()
        run: docker logs pp-postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      # `npm ci`, never `npm install`: it installs the committed lockfile exactly and fails if
      # the lockfile and the manifest disagree, so this job cannot pass against a dependency
      # set nobody reviewed.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned upstream binary rather than gitleaks-action, which requires a licence key
      # for organisation-owned repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1
