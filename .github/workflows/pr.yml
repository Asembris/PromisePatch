name: pr

on:
  # Documentation is excluded rather than code being included, and the direction is the point.
  # A filter that listed the paths worth testing would quietly stop testing the next language,
  # package or fixture directory somebody adds, and nothing would fail to say so. This one
  # names the single thing that is safe to skip -- Markdown -- so every other file in the
  # repository, present and future, still runs every job below: Python, TypeScript, the
  # lockfiles, the Dockerfiles, the migrations, the compose file, and this workflow itself.
  #
  # `docs/` is deliberately not excluded wholesale. It holds `docs/effect-sets/scenarios.v1.json`,
  # the frozen sixteen-scenario manifest whose content hash is asserted as a literal by
  # `scripts/tests/test_effect_set_manifest.py`. That file lives under `docs/` because it is
  # published evidence, not because it is prose: editing it changes what this repository
  # claims, and has to fail a test rather than skip one. Ignoring `docs/**` would have made the
  # one change nobody may make silently the one change CI never looks at.
  #
  # A run skipped this way reports no check at all rather than a green one. Branch protection
  # that requires these jobs by name must stop requiring them, or a documentation-only pull
  # request waits for a status that will never arrive.
  #
  # `workflow_dispatch` is the escape hatch from exactly that, and it is why it exists: a SHA
  # that has to pass CI before it is released may touch no code at all. Neither trigger below
  # fires on a documentation-only commit, and a run that never started cannot be waited for,
  # re-requested or read -- so the manual trigger is the only way to produce one on that SHA.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Distinct from the `effect-sets-` group in `.github/workflows/effect-sets.yml`. Two workflows
# sharing one concurrency group cancel each other's runs on the same ref, so the product gate and
# the benchmark would take turns reporting nothing.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  GITLEAKS_VERSION: "8.21.2"
  NODE_VERSION: "24"

# Every job here tests something that exists. The engine and its static gates came first; the
# backend, the database and the frontend were added as each became real code that a change to
# another part of the repository could break. There is still no AWS job and no AWS secret: the
# semantic boundary is tested against its deterministic fake and a stub at the Bedrock
# transport, and the one test that calls Bedrock for real is marked `bedrock_live`, deselected
# by default, and deliberately not run here.
#
# Each database-backed job brings its own disposable PostgreSQL, on its own runner. Nothing
# here reaches a hosted database, and no two jobs share one -- the fixture reset truncates
# every table PromisePatch owns, and two suites doing that to one database would fail each
# other at random rather than report anything true.
#
# The sixteen frozen effect-set scenarios are not here. They run whole and unmodified in
# `.github/workflows/effect-sets.yml`, which is expected to be red and whose badge says so. A
# badge is per workflow rather than per job, so keeping the benchmark beside these jobs meant one
# permanently red badge on a repository whose product suite passes. This workflow's badge is the
# product gate's, and its red means a regression.

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # Two invocations, not one: both test directories contain a `conftest`, and mypy
      # resolves a module by name rather than by path. Checking them together would be
      # ambiguous, and excluding one of them would be checking less.
      - run: uv run mypy packages/promise-graph packages/order-contract apps/backend
      - run: uv run mypy apps/order-simulator

  tests:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: >
          uv run pytest packages/promise-graph
          --cov=promise_graph
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

  contract:
    name: order contract + order system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # No database, no network and no credential of any kind: the order system owns a SQLite
      # file it creates in a temporary directory, and the wire contract is pure Pydantic.
      - run: uv run pytest packages/order-contract apps/order-simulator

  semantic:
    name: semantic boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # No database, no network and no AWS credential. That is the claim this job exists to
      # keep true: the model boundary is proved against a deterministic fake and a stub at the
      # Bedrock transport, so a repository nobody has authenticated to AWS from still tests
      # every rule that stops a model's answer becoming a write.
      #
      # `test_semantic_grounding.py` is here for the same reason and is the newer half of it:
      # what a reading is *worth* is decided by a pure function, so the rule that refuses an
      # ungrounded binding is exercised with no infrastructure of any kind. The workflow those
      # rules live in needs PostgreSQL and runs in the integration job below; the two live
      # Bedrock suites are marked `bedrock_live` and are deselected by default everywhere.
      #
      # `test_openai_semantic.py` and `test_nvidia_semantic.py` are here rather than with the
      # evaluation jobs because they are boundary tests like the others: both adapters are
      # transport-only, their client import is deferred into a function body, and every request
      # they build is asserted against a stub that sits exactly where the SDK would. No key, no
      # network, and no client package needs to be installed for either to run.
      #
      # The NVIDIA one carries the claim a third challenger rests on: the two OpenAI-compatible
      # requests are pulled apart and their semantic halves asserted equal, so "different model,
      # same question" is checked here rather than believed.
      #
      # `test_explanations.py` belongs here for the same reason as the grounding suite: what a
      # settled outcome may be said to mean is decided by a pure projection over the canonical
      # fixture, so every rule that stops a fluent passage becoming an authority -- an invented
      # reference, a dropped cause, a figure from nowhere, a provider that is simply down --
      # runs with no database, no credential and no network.
      - run: >
          uv run pytest
          apps/backend/tests/test_semantic_contracts.py
          apps/backend/tests/test_semantic_provider.py
          apps/backend/tests/test_semantic_grounding.py
          apps/backend/tests/test_explanations.py
          apps/backend/tests/test_bedrock_semantic.py
          apps/backend/tests/test_openai_semantic.py
          apps/backend/tests/test_nvidia_semantic.py

  transport:
    name: mcp protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # No database, no credential, no model, and no network beyond a loopback socket. The MCP
      # server this job starts is the one `pp mcp` runs and the client is the official SDK's,
      # so what is checked is the protocol -- initialization, negotiation, discovery, framing,
      # the bearer challenge, the `Origin` and `Host` rejections, the JSON-RPC error codes and
      # the absence of a session to resume. Registering two tools and listing them would prove
      # none of it.
      #
      # The pin is asserted here too, and asserted as a *revision*: the SDK also speaks a later
      # one through a different entry point, so a version bump that moved the handshake default
      # has to fail a test rather than quietly change what this endpoint negotiates.
      #
      # What a tool call *causes* is a different question and needs PostgreSQL; it runs in the
      # integration job below, which drives the whole chain end to end.
      - run: >
          uv run pytest
          apps/backend/tests/test_mcp_protocol.py
          apps/backend/tests/test_status_view.py

  evaluation:
    name: semantic evaluation
    runs-on: ubuntu-latest
    env:
      # DeepEval reports usage and errors home unless told not to. It is told not to, here and
      # in the suite's own fixture, so a CI run sends nothing anywhere. PromisePatch evaluation
      # data is never uploaded to an external service.
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      ERROR_REPORTING: "NO"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The only job that installs the `evals` group. It is not a default group, so every other
      # job here -- and the production image, which syncs `--no-dev` -- carries none of the
      # evaluation framework's dependency tree.
      - run: uv sync --frozen --all-packages --group evals

      # The dataset is the instrument, so it is checked before anything is measured with it.
      # This runs production's own lexicon and grounding rules over every gold case: a label
      # PromisePatch could not produce fails here rather than making every model look wrong.
      - name: The gold dataset agrees with production
        run: uv run python -m evals validate

      # No AWS credential, no OpenAI credential, no network. Every answer comes from a scripted
      # payload through the deterministic fake, and import-linter contracts stop both vendor SDKs
      # entering this package's import graph at all. No live model benchmark runs in CI.
      - name: Deterministic scorers, budget refusals and the DeepEval adapter
        run: uv run pytest evals/tests

      - name: The whole dataset, scored offline, gates and all
        run: uv run python -m evals replay

      # The explanation gate's own instrument, checked the same way and for the same reason: a
      # fixture describing a state the engine cannot reach measures nothing while looking
      # exactly like a measurement. This runs the projection's closed vocabularies, the
      # deterministic renderer and the request contract over all thirty-five cases, and it
      # prints counts rather than passages so the fourteen sealed ones stay sealed in the log.
      - name: The explanation dataset agrees with production
        run: uv run python -m evals explanation-validate

      # The preflight. It names the dataset, the model under test, the judge, the one-call rule
      # and the derived ceilings, and it constructs no client to do any of it.
      - name: The P4.8 preflight builds no client and calls nothing
        run: uv run python -m evals explanation-plan

      # Generation, acceptance, structural scoring, one judge verdict per accepted passage, and
      # every gate. Every passage and every verdict comes from a hand-authored payload; nothing
      # here reaches Bedrock, NVIDIA or OpenAI, and the one-call-per-passage rule is asserted
      # with instrumentation in the suite above rather than assumed here.
      - name: Explanation quality, scored offline, gates and all
        run: uv run python -m evals explanation-replay

      # The live benchmark's composition root -- the one module that can spend money -- and the
      # refusals that decide whether it does. No AWS credential and no network: every case here
      # either refuses, stops at the preflight, or rebuilds a report from stored answers. The
      # benchmark itself is never executed in CI, and no AWS secret exists for it to use.
      - name: The live composition root refuses to spend without being told to
        run: uv run pytest scripts/tests

      # The same suite again, in the environment that would make an accident possible.
      #
      # This job needs no AWS credential and is given none. That is not what keeps it safe, and
      # the point of running this step is to stop anybody believing it is: a benchmark once
      # became live from inside a test, and the only thing that stopped it spending was AWS
      # denying access to the model. A safety property resting on a missing credential, an
      # unpriced model or an IAM denial is a property somebody can remove on purpose one
      # afternoon without realising what they removed.
      #
      # So every variable a spending machine would carry is set here, to syntactically valid
      # nonsense, and the suite must still pass. What refuses is the harness: --live buys
      # nothing without a scope-bound authorisation typed at the invocation, and a process
      # running under pytest cannot construct a paid provider at all. If a future change to
      # this workflow, or to a runner image, starts injecting real AWS variables, the interlock
      # is what still protects it -- and this step is what proves that claim rather than
      # asserting it.
      - name: A credentialed environment still cannot buy inference from a test
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_SESSION_TOKEN: FwoGZXIvYXdzEEYaDEXAMPLESESSIONTOKEN
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          PP_LLM_PROVIDER: bedrock
          PP_BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
        run: >
          uv run pytest
          scripts/tests/test_spend_interlock.py
          scripts/tests/test_openai_challenger.py
          scripts/tests/test_nvidia_challenger.py
          evals/tests/test_authorisation.py
          evals/tests/test_provider_failure.py
          evals/tests/test_explanation_run.py

      # The same claim for the second provider, and a syntactically valid OpenAI key to make it
      # mean something. No repository secret exists for this and none is needed: the value below
      # is nonsense that belongs to nobody, and the point is that a *plausible* credential is not
      # what decides whether inference can be bought. What decides it is the scope-bound
      # authorisation nobody typed and the interlock that stops a pytest process constructing a
      # paid provider at all.
      #
      # Nothing in this step reaches OpenAI. The suite's own socket guard raises on any
      # connection leaving the machine and asserts the count of them is zero.
      - name: A key-carrying environment still cannot buy OpenAI inference from a test
        env:
          OPENAI_API_KEY: sk-notarealkey-000000000000000000000000000000000000
        run: uv run pytest scripts/tests/test_openai_challenger.py

      # The same claim for the third provider, and this one matters even though its endpoint is
      # free. "Free" is not "harmless": the resource a stray CI call would spend is somebody's
      # prototype quota, and a benchmark run from inside a test would be a measurement nobody
      # asked for recorded under an experiment's name. So the environment below carries a
      # syntactically valid NVIDIA key and the real hosted base URL, and the suite must still
      # pass with nothing called.
      #
      # No repository secret exists for this and none is needed. What refuses is the harness:
      # the scope-bound authorisation nobody typed, and the interlock that stops a pytest
      # process constructing a paid provider at all -- neither of which cares whether a
      # credential is present, valid, or free to use. The suite's own socket guard raises on
      # any connection leaving the machine and asserts the count of them is zero.
      - name: A key-carrying environment still cannot buy NVIDIA inference from a test
        env:
          NVIDIA_API_KEY: nvapi-notarealkey-0000000000000000000000000000000000000000
          NVIDIA_API_BASE_URL: https://integrate.api.nvidia.com/v1
        run: uv run pytest scripts/tests/test_nvidia_challenger.py

      # Type-checked here rather than in the `mypy` job: that job installs no evaluation
      # dependencies, and this is the only job that has the framework the adapter imports.
      - run: uv run mypy evals scripts

  properties:
    name: hypothesis (ci profile)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run pytest packages/promise-graph/tests/properties

  imports:
    name: import-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The evaluation group is installed here alone among the static-gate jobs, because two of
      # the contracts are about it: that no production package can reach the evaluation code or
      # the framework behind it, and that the framework stays one module wide inside it. A
      # contract checked against a package that is not present is not a contract.
      - run: uv sync --frozen --all-packages --group evals
      - run: uv run lint-imports

  backend:
    name: backend + postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages

      - name: Start a disposable PostgreSQL 16
        # Started here rather than declared as a service container so the credentials can be
        # generated for this run: a password written into this file would be a password in the
        # repository, and gitleaks would be right to say so. The init directory is the one the
        # local stack mounts, so the managed-host API roles exist here too and the revocation
        # of them in migration 0002 is exercised rather than skipped.
        run: |
          set -euo pipefail
          superuser_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          worker_password="$(openssl rand -hex 12)"
          owner_password="$(openssl rand -hex 12)"
          for secret in "$superuser_password" "$app_password" "$session_secret" \
                        "$worker_password" "$owner_password"; do
            echo "::add-mask::$secret"
          done

          docker run --detach --name pp-postgres \
            --env POSTGRES_PASSWORD="$superuser_password" \
            --env POSTGRES_DB=promisepatch \
            --volume "$PWD/docker/postgres/init:/docker-entrypoint-initdb.d:ro" \
            --publish 127.0.0.1:5432:5432 \
            postgres:16-alpine

          # The official image runs /docker-entrypoint-initdb.d against a temporary server
          # started with listen_addresses='' -- reachable on the unix socket and nowhere else --
          # then stops it and restarts listening on TCP. Polling the default socket therefore
          # sees "accepting connections" during initialisation and "rejecting connections" a
          # moment later, in the restart window, which is exactly how this step failed. So poll
          # TCP, which the temporary server never answers, and require three consecutive
          # successes so no momentary window can be mistaken for a ready database.
          ready=0
          for _ in $(seq 1 90); do
            if [ "$(docker inspect --format '{{.State.Running}}' pp-postgres)" != "true" ]; then
              docker logs pp-postgres
              echo "PostgreSQL exited during initialisation" >&2
              exit 1
            fi
            if docker exec pp-postgres \
                 pg_isready --quiet -h 127.0.0.1 -p 5432 -U postgres -d promisepatch; then
              ready=$((ready + 1))
              if [ "$ready" -ge 3 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          if [ "$ready" -lt 3 ]; then
            docker logs pp-postgres
            echo "PostgreSQL never accepted TCP connections on 127.0.0.1:5432" >&2
            exit 1
          fi

          address="127.0.0.1:5432/promisepatch"
          {
            echo "PP_ENV=local"
            echo "PP_MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:$superuser_password@$address"
            echo "PP_DATABASE_URL=postgresql+asyncpg://promisepatch_app:$app_password@$address"
            echo "PP_DB_APP_PASSWORD=$app_password"
            echo "PP_SESSION_SECRET=$session_secret"
            echo "PP_DEMO_WORKER_PASSWORD=$worker_password"
            echo "PP_DEMO_OWNER_PASSWORD=$owner_password"
            echo "PP_ALLOW_FIXTURE_RESET=true"
          } >> "$GITHUB_ENV"

      - name: Migrate an empty database to head
        run: uv run alembic -c apps/backend/alembic.ini upgrade head

      - name: The schema is the revision this build was written against
        run: |
          uv run alembic -c apps/backend/alembic.ini current
          uv run alembic -c apps/backend/alembic.ini check

      # One process, no parallelism: several of these tests reload the fixture, which
      # truncates every table PromisePatch owns.
      #
      # The order-system tests run here too, and they run both applications for real: the
      # order system over its own SQLite file in a temporary directory, PromisePatch over this
      # job's PostgreSQL, and signed HTTP between them. Nothing about them needs a credential
      # that is not generated above.
      #
      # `test_effect_sets.py` is excluded here and runs whole, unmodified, in the `effect sets`
      # job of `.github/workflows/effect-sets.yml`. It measures the implementation against a
      # frozen manifest rather than gating the product, and the scenarios that disagree with
      # their frozen labels are committed failing on purpose. Leaving them in this job made it
      # permanently red, which made its red say nothing: a real regression anywhere in the
      # backend would have looked exactly like the failure that was already there. Nothing about
      # those tests is skipped, weakened or deselected -- only which job, and now which
      # workflow, their red colours has changed.
      - name: Backend suite, integration tests included
        run: uv run pytest apps/backend --ignore=apps/backend/tests/test_effect_sets.py

      - name: PostgreSQL logs
        if: failure()
        run: docker logs pp-postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      # `npm ci`, never `npm install`: it installs the committed lockfile exactly and fails if
      # the lockfile and the manifest disagree, so this job cannot pass against a dependency
      # set nobody reviewed.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: whole-stack browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # Standard library only, so this needs no dependency resolution of its own.
      - name: Generate the local stack environment
        run: python3 scripts/bootstrap_local_env.py

      - name: Bring up the stack
        # `--wait` is the gate: PostgreSQL healthy, migrations exited zero, the fixture loaded,
        # readiness green, the frontend serving. A failure anywhere in that chain fails here
        # rather than arriving later as a confusing browser timeout.
        run: docker compose up --detach --wait

      - name: Install the browser
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser suite against the running stack
        working-directory: apps/frontend
        run: npm run e2e

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned upstream binary rather than gitleaks-action, which requires a licence key
      # for organisation-owned repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1
