[project]
name = "promise-graph"
version = "0.1.0"
description = "Deterministic promise-graph engine: reachability, temporal availability, impact classification, fingerprinting and revalidation for made-to-order commitments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promise_graph"]
