[project]
name = "promise-graph"
version = "0.1.0"
description = "Deterministic promise-graph engine: reachability, temporal availability, impact classification, fingerprinting and revalidation for made-to-order commitments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promise_graph"]

# The package carries its own pytest configuration so that `pytest tests` works from this
# directory on its own terms. A clean clone holds the whole monorepo, whose root configuration
# declares `pytest-asyncio` settings under `--strict-config`; a standalone environment has no
# such plugin and the run would abort on an unknown option before collecting anything. Declaring
# the section here makes this directory pytest's rootdir, so the engine's suite depends on
# nothing outside the package.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
markers = [
    "property: Hypothesis property-based invariant tests",
]
