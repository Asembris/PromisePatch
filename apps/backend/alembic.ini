[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# The database URL is not configured here. It is a credential, it belongs in the
# environment, and env.py reads it from PP_MIGRATION_DATABASE_URL through the settings model
# so it can never be committed by accident.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
