[project]
name = "promisepatch"
version = "0.1.0"
description = "PromisePatch backend: api, worker and mcp entrypoints over the deterministic promise-graph engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<25",
    "typer>=0.15,<1",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<24",
    "tzdata>=2024.2",
    "httpx2>=2.0,<3",
    "boto3>=1.35,<2",
    # Pinned exactly, not floated. The hackathon's Alexa+ route is a claim about a *protocol
    # revision* rather than about a package, and the two move independently: this release's
    # `initialize` handshake settles on 2025-11-25, and a minor bump that moved the handshake
    # default onto a later era would silently change what our server negotiates while every
    # test still passed. `tests/test_mcp_protocol.py` asserts the revision itself, so the pin
    # and the assertion fail together rather than drifting apart.
    "mcp==2.2.0",
    "promise-graph",
    "order-contract",
]

[project.scripts]
pp = "promisepatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promisepatch"]
