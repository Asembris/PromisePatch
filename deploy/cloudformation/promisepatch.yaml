AWSTemplateFormatVersion: "2010-09-09"

# The whole P6 deployment, in one stack.
#
#   internet ──443──▶ caddy (TLS) ──▶ api ──┬──▶ RDS PostgreSQL (private, encrypted)
#                       │                   └──▶ Bedrock (one inference profile)
#                       ├──▶ mcp   ──authenticated HTTP──▶ api
#                       └──▶ order-simulator ──signed webhook over public HTTPS──▶ api
#                                            (its own SQLite file on its own volume)
#              worker ──▶ RDS         (no listening socket, restarted by the runtime)
#
# **One host, one database, and nothing else.** The local stack already separates these
# processes by credential and by import graph rather than by machine, and that separation is
# what the product's authority boundary rests on: `mcp` is given no database URL and cannot
# import the domain, so it reaches a case only by an authenticated call to `api`. Splitting the
# five containers across five AWS services would not strengthen that boundary -- it is enforced
# by an import-linter contract and by which environment file each container receives -- and it
# would add a load balancer, a service mesh's worth of task definitions and a NAT gateway to a
# deployment whose job is to prove one loop survives outside a laptop.
#
# So the compute is a single EC2 instance running the same images with the same commands and
# the same per-container environment files. What genuinely cannot stay on the host is the
# state, and it does not: the case state and the step ledger live in RDS, which survives the
# instance being stopped, replaced or terminated. That is the difference the deployment is
# supposed to prove.
#
# **Honest limits.** One instance is one point of failure and is not a highly available
# deployment; the restart proof here is a container and an instance restart against durable
# state, not a failover. The order simulator is a separate system in the ways that matter --
# its own image, process, store, port and zero shared credentials -- but in this stack it
# shares a host, and its webhook to `api` therefore leaves the host and returns through the
# public HTTPS endpoint so that the signature check crosses real TLS rather than a bridge
# network. Both are named in docs/p6.1-deployment-preflight.md rather than left implicit.

Description: >-
  PromisePatch P6 deployed external loop: one EC2 host running api, worker, mcp, the order
  simulator and a TLS proxy, against a private encrypted RDS PostgreSQL instance. The evidence
  UI is not deployed by this stack: it is a Vite dev server locally and needs a static build
  stage first, so it is a named P6 gap rather than a container here.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Placement }
        Parameters: [VpcId, HostSubnetId, DatabaseSubnetIds]
      - Label: { default: Ingress and TLS }
        Parameters: [TlsHostname, AllowedIngressCidr]
      - Label: { default: Sizing }
        Parameters:
          [InstanceType, DatabaseInstanceClass, DatabaseStorageGiB, DatabaseBackupRetentionDays]
      - Label: { default: Release }
        Parameters: [Environment, ImageTag]
      # Apart from Release on purpose. Neither of these is an application release: one
      # replaces the host and one erases every case. `deploy.sh stack` passes the value the
      # stack already carries for the first and a literal `false` for the second, so a release
      # can only ever leave both where they were.
      - Label: { default: Infrastructure and demo state }
        Parameters: [HostAmiId, SeedDemoFixtureOnFirstBoot]

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]{1,16}"
    Description: Names the secret path, the log group and the database. Not a tier claim.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: An existing VPC. The stack creates no VPC, no subnet and no NAT gateway.

  HostSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A subnet with a route to an internet gateway. The host needs outbound 443 for Bedrock,
      ECR, SSM, CloudWatch Logs and the ACME certificate order, and inbound 443 for the MCP
      endpoint and the webhook. A public subnet with a public address is one NAT gateway
      cheaper than a private subnet, and the security group is what limits the exposure.

  DatabaseSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or more subnets in different availability zones. RDS requires the subnet group to
      span zones even for a single-AZ instance. The database is not publicly accessible.

  TlsHostname:
    Type: String
    Default: ""
    Description: >-
      The hostname the certificate is issued for and the name every client verifies. Supply a
      name you control and point its A record at the stack's ElasticIp output. Leave it empty
      and the stack derives `<elastic-ip>.sslip.io`, a public wildcard-DNS name that already
      resolves to the address before the host boots, which is what removes the ordering problem
      this parameter otherwise has: the address is allocated by this stack, so no record can be
      created until after a first deploy. Either way the certificate is a real, publicly
      trusted, automatically issued one for the exact name clients verify -- leaving TLS
      verification off somewhere is the one thing this stack must not do, and neither branch
      does it.
    AllowedPattern: "|[a-z0-9.-]{4,253}"

  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      Who may reach 80 and 443. The default is the internet because the loop is meant to be
      reached from outside; narrow it to a known address range when only a single client and
      the ACME validation need in.
    AllowedPattern: "([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}"

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium]
    Description: Graviton. The images build for arm64 and the deployment role caps this list.

  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]

  DatabaseStorageGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100

  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: >-
      How many days of automated backups the database keeps. Never 0: that switches automated
      backups off entirely, and point-in-time recovery with them. A week is the intent and is
      the default. It is a parameter rather than a constant because an account on the AWS Free
      Tier plan cannot have it -- RDS refuses the create outright with "the specified backup
      retention period exceeds the maximum available to free tier customers" -- and a
      deployment that has to lower it should have to say so where the value can be read, rather
      than have the number quietly edited in the template.

  ImageTag:
    Type: String
    Description: >-
      The release this deploy intends to run: the commit SHA, never `latest`, because G8
      requires verifying the deployed version rather than an old image and a moving tag makes
      that unanswerable. The host does not read it -- it converges on the `image-tag`
      parameter in SSM, which the same `deploy.sh` run writes from the same commit -- so this
      records the intent and `DeclaredImageTag` publishes it for the smoke check to compare
      with what the deployed process says it is.
    AllowedPattern: "[A-Za-z0-9._-]{1,128}"

  HostAmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      An Amazon Linux 2023 arm64 image, resolved at deploy time by deploy.sh and passed in, so
      no AMI id is pinned in git. It is not read from the AWS-published SSM parameter by the
      stack, though that parameter is the same fact: resolving it in the template requires the
      CloudFormation service role to hold ssm:GetParameters on `parameter/aws/service/*`, and
      the deployment role is scoped to this project's own parameters. Resolving it with the
      ec2:DescribeImages the submitting identity already holds keeps that scope rather than
      widening it to make a template read work.

      **Changing this replaces the host.** `ImageId` is a replacement property on
      `AWS::EC2::Instance`, so a new value is an Add and a Remove, a new instance, a first boot
      and a re-ordered certificate. That is a deliberate operation -- `deploy.sh host-image` --
      and never a side effect of a release: `deploy.sh stack` passes back the value the stack
      already declares, so an application release cannot move it by resolving a newer image.

  SeedDemoFixtureOnFirstBoot:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether an instance's first boot loads the demo fixture. `pp reset-demo-state` replaces
      every domain row PromisePatch owns, and the database outlives the host, so on a
      replacement instance that boot step erases the cases the deployment exists to prove
      survive it. It is therefore false unless a deploy says otherwise, and it gates both the
      seed invocation and the `PP_ALLOW_FIXTURE_RESET` the seed needs to run at all -- two
      layers, so a hand-run `compose run seed` on a host provisioned with it off is refused by
      the application rather than only by the bootstrap.

      True is for a deployment whose database has no cases yet: a first deploy, and the clean
      fixtures a G8 rehearsal starts from. It takes effect only on an instance's first boot, so
      setting it on a running host changes nothing until that host is replaced.

Conditions:
  # The address this stack allocates is the only one a DNS record could point at, so when no
  # name is supplied the name is made from the address rather than waited for. `Ref` on an EIP
  # is its public address, and sslip.io answers `a.b.c.d.sslip.io` with `a.b.c.d` for every
  # address, so the record exists before the host asks for a certificate for it.
  DeriveTlsHostname: !Equals [!Ref TlsHostname, ""]

Resources:
  # --------------------------------------------------------------------------------- network

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PromisePatch host. Inbound 80/443 only; egress 443 and the database.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTPS for the MCP endpoint, the workspace and the inbound webhook.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
        - Description: >-
            ACME HTTP-01 validation and the redirect to HTTPS. Nothing else is served here.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        # Egress is a closed list, not the default allow-all. Bedrock, ECR, SSM, CloudWatch
        # Logs, the ACME directory and the public image registries are all 443; the database is
        # the only other destination this host has any reason to reach.
        - Description: Bedrock, ECR, SSM, CloudWatch Logs, ACME, image registries.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Project, Value: promisepatch }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PromisePatch database. Reachable only from the host security group.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: The database initiates nothing.
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags: [{ Key: Project, Value: promisepatch }]

  # Declared apart from the groups so the two can reference each other without a cycle. This
  # is the only path to the database: no public address, no CIDR allowance, no bastion.
  DatabaseIngressFromHost:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DatabaseSecurityGroup.GroupId
      Description: PostgreSQL from the application host, and from nothing else.
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt HostSecurityGroup.GroupId

  HostEgressToDatabase:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt HostSecurityGroup.GroupId
      Description: PostgreSQL to the database this stack creates.
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !GetAtt DatabaseSecurityGroup.GroupId

  # ------------------------------------------------------------------------------- durability

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: PromisePatch database subnets.
      SubnetIds: !Ref DatabaseSubnetIds
      Tags: [{ Key: Project, Value: promisepatch }]

  Database:
    Type: AWS::RDS::DBInstance
    # Retained on stack deletion on purpose. The case state is the evidence a deployed loop
    # actually happened; a `delete-stack` typed at the wrong moment must not be able to erase
    # it. Deleting it is a separate, deliberate act.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub promisepatch-${Environment}
      Engine: postgres
      # Deliberately unpinned to a minor version: RDS selects the current default for the
      # major, and the schema is Alembic's rather than any version's. The major matters and is
      # the one the local stack uses.
      EngineVersion: "16"
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseStorageGiB
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      MasterUsername: postgres
      # Never a literal, never a stack parameter, never in the template or in an event log.
      # CloudFormation resolves the SecureString at create time and does not echo it.
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/promisepatch/${Environment}/db-master-password}}"
      DBName: promisepatch
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      Tags: [{ Key: Project, Value: promisepatch }]

  # ---------------------------------------------------------------------------------- output

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /promisepatch/${Environment}
      # Container output leaves the host, so restarting a process does not erase the evidence
      # of what it did. Fourteen days is long enough to review a rehearsal and short enough
      # that ingestion cost stays a rounding error.
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: promisepatch }]

  # ----------------------------------------------------------------------------- the runtime

  InstanceRole:
    Type: AWS::IAM::Role
    # The policy below names the log group by ARN rather than by !GetAtt, so this ordering is
    # stated rather than inferred from a reference that is no longer there.
    DependsOn: LogGroup
    Properties:
      RoleName: PromisePatchInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # The only managed policy anywhere in this stack, and it buys a real reduction: with
      # Session Manager the host needs no inbound SSH port, no key pair and no bastion.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PromisePatchRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PullOwnImages
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                # Named rather than referenced: the registry is not part of this stack. It
                # has to exist before the stack does -- a host that booted before any image was
                # pushed could not start -- and it should outlive `delete-stack` so a redeploy
                # does not re-push every layer. deploy/deploy.sh creates it, idempotently.
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/promisepatch/backend
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/promisepatch/order-simulator
              - Sid: RegistryAuthTokenHasNoResourceForm
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ReadOwnSecretsAtBoot
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/promisepatch/${Environment}/*
              - Sid: DecryptThemThroughSsmOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
              - Sid: ShipContainerOutput
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                # Constructed rather than `!GetAtt LogGroup.Arn`. Resolving that attribute
                # makes CloudFormation call `logs:DescribeLogGroups` as the *deployment role*,
                # and that action is evaluated account-wide: a grant scoped to
                # `log-group:/promisepatch/*` never authorizes it, so the attribute read is
                # denied and the role cannot be created at all. It is the same wrongly shaped
                # grant P6.1 found and fixed on the developer role, in a second policy. The ARN
                # is fully determined by the name this stack chose, so building it needs no
                # permission and grants the runtime nothing wider.
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/promisepatch/${Environment}
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/promisepatch/${Environment}:log-stream:*
              # The orchestrator's one semantic job. A cross-region inference profile needs
              # both the profile ARN and the foundation-model ARNs in every region it may
              # route to -- scoping to the profile alone produces a denial at call time.
              - Sid: InvokeExactlyOneModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0
      Tags: [{ Key: Project, Value: promisepatch }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: PromisePatchInstanceProfile
      Roles: [!Ref InstanceRole]

  # A stable address, allocated before the host so the DNS record can be pointed at it and the
  # certificate ordered on first boot. It also means stopping and starting the instance does
  # not invalidate the hostname every client verifies.
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Project, Value: promisepatch }]

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Host

  # Renaming this resource is how the instance is deliberately replaced.
  #
  # Nothing else about an `AWS::EC2::Instance` can be made to require recreation on demand:
  # a change to `UserData`, and a change to `AdditionalInfo`, are both reported by a change
  # set as `Conditionally`, and both were observed resolving to an in-place modification
  # that leaves the instance id alone and the files on its disk untouched. A new logical
  # name is reported as an Add and a Remove, which is a new instance every time.
  #
  # It has been renamed twice: once to install the per-boot convergence below, and once to
  # fix the bootstrap that installed it. Now that a host converges from SSM at every boot,
  # a release is a parameter write and a reboot, and the name should not have to move again.
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref HostAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref HostSubnetId
      SecurityGroupIds: [!GetAtt HostSecurityGroup.GroupId]
      # No KeyName. Access is Session Manager or nothing, which is why no inbound 22 exists.
      Monitoring: false
      MetadataOptions:
        # IMDSv2 only. A token-less metadata read is how an application-layer request forgery
        # turns into the instance's credentials, and this host holds a Bedrock permission.
        # This is the control that matters and it is unchanged: a plain SSRF cannot mint the
        # token, because minting one requires a PUT.
        HttpTokens: required
        # Two, not one, and one was wrong. Everything on this host runs in a container, and the
        # Docker bridge costs a hop -- so at a limit of 1 the metadata response expires before
        # it reaches the process that asked, and *no container can obtain the instance role at
        # all*. It failed exactly there: the deployed worker's first Bedrock call came back
        # NoCredentialsError in 2 ms, having made no network request, while the host itself
        # pulled images and read its secrets perfectly well -- because those run on the host.
        # Two is what AWS documents for containerised workloads on EC2, and it is the smallest
        # value that lets the runtime use the role this stack created for it.
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Project, Value: promisepatch }
        - { Key: Name, Value: !Sub "promisepatch-${Environment}" }
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              exec > >(tee /var/log/promisepatch-boot.log) 2>&1

              # **This provisioning script runs once, on this instance's first boot, and not
              # again.** cloud-init's scripts-user module is once-per-instance, and `UserData` is
              # not a replacement trigger for `AWS::EC2::Instance`: a stack update carrying a new
              # `ImageTag` reports `UPDATE_COMPLETE`, leaves the instance id unchanged, and the host
              # goes on serving the image it first booted with. Both were observed, and the second is
              # how a release comes to be believed deployed when it is not.
              #
              # So nothing a release changes is written by this script. The composition, the TLS
              # configuration and the image tag are read from SSM by `converge.sh` below, which the
              # systemd unit runs at **every** boot. A release is therefore a parameter write and a
              # reboot -- `deploy.sh rollout` -- and what the host serves is what the deploy named
              # rather than what this instance happened to boot with. `/healthz` reports the commit
              # the running image was built from, so the two can be compared from outside.

              dnf -y update
              dnf -y install docker amazon-cloudwatch-agent
              mkdir -p /usr/local/lib/docker/cli-plugins
              systemctl enable --now docker

              COMPOSE_VERSION=v2.32.4
              curl -fsSL --proto '=https' --tlsv1.2 \
                "https://github.com/docker/compose/releases/download/${!COMPOSE_VERSION}/docker-compose-linux-aarch64" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose

              REGION=${AWS::Region}
              ACCOUNT=${AWS::AccountId}
              PREFIX=/promisepatch/${Environment}
              REGISTRY=${!ACCOUNT}.dkr.ecr.${!REGION}.amazonaws.com
              install -d -m 0750 /opt/promisepatch /opt/promisepatch/env

              param () { aws ssm get-parameter --with-decryption --region "${!REGION}" \
                           --name "${!PREFIX}/${!1}" --query Parameter.Value --output text; }

              DB_PASSWORD=$(param db-app-password)
              DB_MASTER_PASSWORD=$(param db-master-password)
              MCP_BEARER_TOKEN=$(param mcp-bearer-token)
              SESSION_SECRET=$(param session-secret)
              WEBHOOK_SECRET=$(param order-webhook-secret)
              INTERNAL_TOKEN=$(param internal-service-token)
              WORKER_PASSWORD=$(param demo-worker-password)
              OWNER_PASSWORD=$(param demo-owner-password)
              # Optional, and absent on a deployment nobody has given an address for. An empty
              # contact is a valid ACME registration; a contact that cannot receive mail is not.
              ACME_CONTACT=$(param acme-contact 2>/dev/null || true)

              HOST=${Database.Endpoint.Address}
              PORT=${Database.Endpoint.Port}
              PUBLIC=https://${TlsHostname}

              # One file per container, exactly as the local stack does it. The migration and seed
              # credential never reaches api, worker or mcp; mcp receives no database URL at all.
              umask 0077
              cat > /opt/promisepatch/env/migrate.env <<EOF
              PP_ENV=aws
              PP_AWS_REGION=${!REGION}
              PP_MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:${!DB_MASTER_PASSWORD}@${!HOST}:${!PORT}/promisepatch
              PP_DB_APP_PASSWORD=${!DB_PASSWORD}
              # The first of the two layers gating the seed. `migrate` does not read it and is
              # unaffected; `seed` is refused by the application itself when it is false, so a
              # hand-run `compose run seed` on a host provisioned without a seed does not erase
              # the database either. `SeedDemoFixtureOnFirstBoot` is the only thing that sets it.
              PP_ALLOW_FIXTURE_RESET=${SeedDemoFixtureOnFirstBoot}
              PP_DEMO_WORKER_PASSWORD=${!WORKER_PASSWORD}
              PP_DEMO_OWNER_PASSWORD=${!OWNER_PASSWORD}
              EOF

              cat > /opt/promisepatch/env/api.env <<EOF
              PP_ENV=aws
              PP_AWS_REGION=${!REGION}
              PP_DATABASE_URL=postgresql+asyncpg://promisepatch_app:${!DB_PASSWORD}@${!HOST}:${!PORT}/promisepatch
              PP_SESSION_SECRET=${!SESSION_SECRET}
              PP_INTERNAL_SERVICE_TOKEN=${!INTERNAL_TOKEN}
              PP_ORDER_SYSTEM_WEBHOOK_SECRET=${!WEBHOOK_SECRET}
              PP_ORDER_SYSTEM_BASE_URL=http://order-simulator:8100
              PP_CORS_ORIGINS=${!PUBLIC}
              # The one-action way in, for somebody being shown the product. Off in every copy of
              # the repository and turned on here, for this deployment, deliberately: it takes no
              # credential, publishes none, and issues a session naming the seeded observer, whom
              # the domain admits to case reads and to no write at all.
              #
              # **Turning it off is not a release.** This file is written by the bootstrap, which
              # cloud-init runs once per instance, and `converge.sh` rewrites no `env/*.env` file
              # -- so setting this to false takes effect only when a *new* instance boots, which
              # means `host-image` and a replaced host. An earlier version of this comment claimed
              # the next boot would do it; that contradicted the comment forty lines above and was
              # found false against the deployment on 2026-09-16. What does end an issued session
              # immediately, with no boot at all, is revoking its row.
              PP_DEMO_SESSION_ENABLED=true
              # The worker every statement arriving over the MCP surface is attributed to.
              # It must name a row the seed actually creates: intake refuses an unknown
              # attester with SURFACE_WORKER_MISSING, so a name nothing seeded is not a
              # cosmetic mislabel -- it is every `report` failing on the first spoken turn.
              PP_SURFACE_WORKER_ID=maya
              # Named explicitly, because the default is the fake provider and is deliberately
              # not inferred from PP_ENV: a deployment that reaches a model does so because it
              # said so, not because something noticed credentials and quietly upgraded itself.
              # This is the one setting that makes the instance role's bedrock:InvokeModel do
              # anything; without it the deployed loop runs, and never calls a model at all.
              PP_LLM_PROVIDER=bedrock
              PP_BEDROCK_MODEL_ID=us.amazon.nova-2-lite-v1:0
              EOF

              cat > /opt/promisepatch/env/mcp.env <<EOF
              PP_ENV=aws
              PP_MCP_BEARER_TOKEN=${!MCP_BEARER_TOKEN}
              PP_MCP_INTENT_API_BASE_URL=http://api:8000
              PP_INTERNAL_SERVICE_TOKEN=${!INTERNAL_TOKEN}
              PP_MCP_ALLOWED_ORIGINS=${!PUBLIC}
              PP_MCP_ALLOWED_HOSTS=${TlsHostname}
              PP_SURFACE_WORKER_ID=maya
              EOF

              # The simulator holds no PostgreSQL credential and shares no environment file. Its
              # webhook target is the public HTTPS name, so the signature it computes is verified
              # across a real TLS connection rather than over a container bridge.
              cat > /opt/promisepatch/env/order-simulator.env <<EOF
              OS_LOG_LEVEL=info
              OS_DATABASE_PATH=/data/order-simulator.sqlite3
              OS_WEBHOOK_URL=${!PUBLIC}/api/integrations/order-system/events
              OS_WEBHOOK_SECRET=${!WEBHOOK_SECRET}
              EOF

              # What this host is, as against what this release is. Where it runs, which registry it
              # pulls from, which name its certificate is for: properties of the instance, fixed for
              # its life, so `converge.sh` reads them from here rather than asking SSM for something
              # that cannot have changed between two boots of the same machine.
              cat > /opt/promisepatch/env/host.env <<EOF
              REGION=${!REGION}
              PREFIX=${!PREFIX}
              REGISTRY=${!REGISTRY}
              TLS_HOSTNAME=${TlsHostname}
              LOG_GROUP=/promisepatch/${Environment}
              EOF
              umask 0022

              # Everything a release changes, in one script that runs at every boot.
              #
              # This is the answer to the defect described at the top of this script. The seed is
              # deliberately not in it: seeding replaces every domain row PromisePatch owns, and this
              # runs at every boot, so a reboot that seeded would erase the cases whose survival is the
              # point of deploying at all.
              cat > /opt/promisepatch/converge.sh <<'CONVERGE'
              #!/bin/bash
              # Bring this host to the version the deployment currently names. Run at every boot by the
              # systemd unit, and by hand after a parameter write.
              set -euo pipefail
              cd /opt/promisepatch
              set -a
              . env/host.env
              set +a

              param () { aws ssm get-parameter --with-decryption --region "$REGION" --name "$PREFIX/$1" --query Parameter.Value --output text; }

              param compose   > docker-compose.yml
              param caddyfile > Caddyfile
              IMAGE_TAG="$(param image-tag)"
              ACME_CONTACT="$(param acme-contact 2>/dev/null || true)"

              umask 0077
              cat > env/stack.env <<ENV
              REGISTRY=$REGISTRY
              IMAGE_TAG=$IMAGE_TAG
              TLS_HOSTNAME=$TLS_HOSTNAME
              LOG_GROUP=$LOG_GROUP
              AWS_REGION=$REGION
              ACME_CONTACT=$ACME_CONTACT
              ENV
              umask 0022

              # The customer transport, written here rather than in env/api.env because it is
              # release state and not a property of this instance. cloud-init writes api.env
              # once and never again, so a setting that lives only there cannot be moved without
              # replacing the host -- and a deployment holding real cases must be able to switch
              # its customer channel on without that. That was the whole of why an operator
              # could not turn Telegram on against the running deployment.
              #
              # Every parameter is optional. Absent, the provider is the fake one, which reaches
              # nobody. The two secrets are written only when they exist rather than as empty
              # values, because an empty PP_TELEGRAM_BOT_TOKEN parses as a credential rather
              # than as none -- which would defeat the refusal-to-start a worker selected for
              # Telegram without one is supposed to make -- and an empty PP_CUSTOMER_LINK_SECRET
              # would sign a customer's approval link with nothing at all.
              CHANNEL_PROVIDER="$(param customer-channel-provider 2>/dev/null || true)"
              if [ -z "$CHANNEL_PROVIDER" ]; then CHANNEL_PROVIDER=fake; fi
              BOT_TOKEN="$(param telegram-bot-token 2>/dev/null || true)"
              LINK_SECRET="$(param customer-link-secret 2>/dev/null || true)"
              umask 0077
              {
                echo "PP_CUSTOMER_CHANNEL_PROVIDER=$CHANNEL_PROVIDER"
                echo "PP_CUSTOMER_LINK_BASE_URL=https://$TLS_HOSTNAME"
                if [ -n "$BOT_TOKEN" ]; then echo "PP_TELEGRAM_BOT_TOKEN=$BOT_TOKEN"; fi
                if [ -n "$LINK_SECRET" ]; then echo "PP_CUSTOMER_LINK_SECRET=$LINK_SECRET"; fi
              } > env/channel.env
              umask 0022

              aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
              docker compose --env-file env/stack.env pull
              docker compose --env-file env/stack.env up -d --remove-orphans
              CONVERGE
              chmod 0750 /opt/promisepatch/converge.sh

              # The unit first, and before anything else that can fail. It is how this host comes back,
              # and a bootstrap that brought the stack up and then died before installing it would leave
              # a host that serves until its next boot and never again. That happened: the seed below ran
              # outside the project directory, compose found no composition, the script stopped there, and
              # the instance was left with no unit and an unseeded database.
              cat > /etc/systemd/system/promisepatch.service <<'EOF'
              [Unit]
              Description=PromisePatch deployed stack
              After=docker.service
              Requires=docker.service

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              # A boot that finds a new image tag pulls it before it can start anything.
              TimeoutStartSec=900
              WorkingDirectory=/opt/promisepatch
              ExecStart=/opt/promisepatch/converge.sh
              ExecStop=/usr/bin/docker compose --env-file env/stack.env down

              [Install]
              WantedBy=multi-user.target
              EOF
              systemctl daemon-reload
              # `--now`, so this boot brings the stack up exactly the way every later boot does: through
              # the unit, running converge.sh. One path, exercised from the first minute.
              systemctl enable --now promisepatch.service

              # Load the fixture once, on this instance, and only when this deploy asked for it.
              #
              # The gate is the point. The database outlives the host, so on a replacement instance
              # this line runs against a database full of real cases and erases every one of them --
              # which is exactly what an ordinary release used to risk, because `deploy.sh stack`
              # resolved a newer AMI at every run and a changed `ImageId` replaces the instance. The
              # release path now passes `SeedDemoFixtureOnFirstBoot=false` literally, so the worst a
              # release can do to the demo world is nothing.
              #
              # `compose run` enables the service's own profile, which is the only thing that does --
              # `up -d` cannot reach it, and neither can `converge.sh`. The `cd` is not decoration:
              # compose reads the composition from the working directory, and without it this line
              # fails and takes the rest of the bootstrap with it.
              cd /opt/promisepatch
              if [ "${SeedDemoFixtureOnFirstBoot}" = "true" ]; then
                docker compose --env-file env/stack.env run --rm -T seed
              else
                echo "SeedDemoFixtureOnFirstBoot is false; the demo fixture was not loaded"
              fi
            # The one substitution the template supplies rather than the parameter list:
            # when no hostname was given, the script below is written with the name made
            # from this stack's own Elastic IP. Every other ${...} in the script is still
            # an ordinary parameter, resource attribute or pseudo-parameter.
            - TlsHostname: !If
                - DeriveTlsHostname
                - !Sub "${ElasticIp}.sslip.io"
                - !Ref TlsHostname

Outputs:
  PublicAddress:
    Description: Point the TlsHostname DNS A record at this before the certificate is ordered.
    Value: !Ref ElasticIp

  TlsHostname:
    Description: >-
      The name the certificate is issued for and every client verifies -- the supplied one, or
      the one derived from ElasticIp. Read it from here rather than assuming which branch ran.
    Value: !If [DeriveTlsHostname, !Sub "${ElasticIp}.sslip.io", !Ref TlsHostname]

  PublicUrl:
    Description: The verified HTTPS origin. The MCP endpoint is this plus /mcp.
    Value: !If [DeriveTlsHostname, !Sub "https://${ElasticIp}.sslip.io", !Sub "https://${TlsHostname}"]

  McpEndpoint:
    Value: !If [DeriveTlsHostname, !Sub "https://${ElasticIp}.sslip.io/mcp", !Sub "https://${TlsHostname}/mcp"]

  WebhookEndpoint:
    Description: Where the separate order system posts its signed events.
    Value: !If
      - DeriveTlsHostname
      - !Sub "https://${ElasticIp}.sslip.io/api/integrations/order-system/events"
      - !Sub "https://${TlsHostname}/api/integrations/order-system/events"

  DatabaseEndpoint:
    Description: Private. Not reachable from outside the host security group.
    Value: !GetAtt Database.Endpoint.Address

  HostInstanceId:
    Description: For `aws ssm start-session --target <this>`, and for the restart proof.
    Value: !Ref Host

  DeclaredImageTag:
    Description: >-
      The commit this deploy intended to run. The host converges on the image tag in SSM,
      which the same deploy wrote, and reports at /healthz the commit its image was built
      from -- so this and that are two independently readable answers to the same question,
      and the deployment smoke check fails when they differ.
    Value: !Ref ImageTag

  DeclaredHostAmiId:
    Description: >-
      The image this host was built from. Published so `deploy.sh stack` can pass it back
      unchanged rather than resolving a newer one, which is what keeps an application release
      from replacing the instance, and so the AMI a deployment actually runs is readable
      without describing the instance.
    Value: !Ref HostAmiId

  DemoFixtureSeededOnFirstBoot:
    Description: >-
      Whether the boot that provisioned an instance would load the demo fixture. False on
      every release. Read it before a host is replaced: it says whether the replacement's
      first boot would erase the cases in the database the old host leaves behind.
    Value: !Ref SeedDemoFixtureOnFirstBoot

  LogGroupName:
    Value: !Ref LogGroup

  InstanceRoleArn:
    Description: The only runtime principal the deployment creates.
    Value: !GetAtt InstanceRole.Arn
