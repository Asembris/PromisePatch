# The deployed composition: SSM /promisepatch/<env>/compose, written to
# /opt/promisepatch/docker-compose.yml at boot. It must fit a 4096-byte standard-tier
# parameter, so the reasoning lives in the template and the P6 docs.
#
# Same images and commands as the local stack; RDS, a TLS proxy in front, CloudWatch Logs.

name: promisepatch

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}
    awslogs-create-group: "false"

networks:
  stack:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so the TLS proxy has a fixed address: the simulator must resolve the
        # public hostname to something, and an instance has no route back to its own public
        # address. Why that keeps the TLS hop real is in the template.
        - subnet: 172.29.0.0/24

services:
  migrate:
    image: ${REGISTRY}/promisepatch/backend:${IMAGE_TAG}
    command: ["alembic", "-c", "apps/backend/alembic.ini", "upgrade", "head"]
    env_file: [env/migrate.env]
    networks: [stack]
    logging: *logging
    restart: "no"

  # Profiled, so `up -d` never reaches it: seeding replaces every domain row and the systemd
  # unit runs `up -d` at every boot. Only the bootstrap's `compose run seed` starts it.
  seed:
    image: ${REGISTRY}/promisepatch/backend:${IMAGE_TAG}
    command: ["pp", "reset-demo-state"]
    profiles: ["seed"]
    env_file: [env/migrate.env]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [stack]
    logging: *logging
    restart: "no"

  api:
    image: ${REGISTRY}/promisepatch/backend:${IMAGE_TAG}
    env_file: [env/api.env, {path: env/channel.env, required: false}]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [stack]
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    image: ${REGISTRY}/promisepatch/backend:${IMAGE_TAG}
    command: ["pp", "worker"]
    env_file: [env/api.env, {path: env/channel.env, required: false}]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [stack]
    logging: *logging
    stop_grace_period: 20s
    restart: unless-stopped

  mcp:
    image: ${REGISTRY}/promisepatch/backend:${IMAGE_TAG}
    command: ["pp", "mcp", "--host", "0.0.0.0", "--port", "8001"]
    env_file: [env/mcp.env]
    depends_on:
      api: { condition: service_healthy }
    networks: [stack]
    logging: *logging
    stop_grace_period: 20s
    restart: unless-stopped

  order-simulator:
    image: ${REGISTRY}/promisepatch/order-simulator:${IMAGE_TAG}
    env_file: [env/order-simulator.env]
    volumes: [order-simulator-data:/data]
    networks: [stack]
    extra_hosts:
      - "${TLS_HOSTNAME}:172.29.0.10"
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificate and ACME account key on a volume, so a restart does not re-order one.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TLS_HOSTNAME: ${TLS_HOSTNAME}
      ACME_CONTACT: ${ACME_CONTACT}
    depends_on:
      api: { condition: service_healthy }
    networks:
      stack:
        ipv4_address: 172.29.0.10
    logging: *logging
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  order-simulator-data:
  caddy-data:
  caddy-config:
