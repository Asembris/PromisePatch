[project]
name = "promisepatch-workspace"
version = "0.0.0"
description = "PromisePatch monorepo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["order-contract", "order-simulator", "promise-graph", "promisepatch"]

[tool.uv]
package = false
native-tls = true

[tool.uv.workspace]
members = [
    "packages/promise-graph",
    "packages/order-contract",
    "apps/backend",
    "apps/order-simulator",
]

[tool.uv.sources]
order-contract = { workspace = true }
order-simulator = { workspace = true }
promise-graph = { workspace = true }
promisepatch = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "httpx2>=2.0,<3",
    "pytest-asyncio>=0.24,<1",
    # The P6 deployment definition is a CloudFormation template, and the test that reads it back
    # needs a parser and its stubs. Declared rather than inherited: PyYAML arrives transitively
    # today, and a test that depended on somebody else's dependency would break for a reason
    # that had nothing to do with it.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # The release guard refuses a change set by running one JMESPath expression over what
    # `describe-change-set` returned, and the test that holds it runs that same expression --
    # read out of `deploy.sh` -- over a payload AWS actually sent. Anything less exercises the
    # stub's answer instead of the filter, which is how `Replacement: Conditional` went unseen.
    # Declared for the same reason as PyYAML above: botocore requires it today, and a test that
    # leaned on that would break for a reason that had nothing to do with it.
    "jmespath>=1.0",
]

# Evaluation only, and deliberately its own group rather than part of `dev`. It is not a default
# group, so an ordinary `uv sync` does not install it, the production image (`--no-dev`) cannot
# reach it, and the CI jobs that test the application carry none of its dependency tree. The two
# jobs that need it -- the evaluation suite and import-linter -- ask for it by name.
evals = [
    "deepeval>=4.2,<5",
    # Declared rather than inherited. The framework above already pulls this in, and depending
    # on that would make the challenger's provider an accident of somebody else's dependency
    # tree -- one `deepeval` release away from vanishing. It stays in the evaluation group
    # because that is the only thing that calls OpenAI: the runtime image syncs `--no-dev` and
    # every other CI job installs no evaluation dependency at all, so a deployed process cannot
    # import the SDK even if a module tried to.
    "openai>=1.60,<4",
    # The live explanation gate reaches Bedrock through whatever credential provider the
    # operator's AWS profile names, and the `aws login` provider refuses to resolve without
    # botocore's CRT extra -- which surfaces as a client that cannot be built, before any
    # request is sent. Declared here rather than in the backend because production authenticates
    # with an instance or task role, which needs none of this: only the workstation that runs a
    # paid evaluation does. A missing dependency that stops a run should be a sync away, not a
    # manual pip install somebody has to rediscover from a traceback.
    "botocore[crt]>=1.35,<2",
]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/promise-graph/src",
    "packages/promise-graph",
    "packages/order-contract/src",
    "packages/order-contract",
    "apps/backend/src",
    "apps/order-simulator/src",
    "apps/order-simulator",
    "evals",
]
# The R1 rehearsal record embeds the frozen G8 evidence reader, sha256 c9731c8f…, which R2-R5
# verified byte for byte. The DEVELOPMENT evidence page embeds its generator, sha256 aee15151…,
# which reproduces the published package. Frozen evidence is never rewritten, so the formatter
# may not touch either.
extend-exclude = ["docs/g8-rehearsal-r1.md", "docs/g8-development-evidence.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "SIM", "RET", "T20", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"packages/promise-graph/tests/**" = ["N802", "N803", "N806"]
# Migration bodies are generated SQL text: a CHECK listing twelve rule ids cannot be
# wrapped without changing the statement it emits.
"apps/backend/alembic/versions/**" = ["E501"]
# Operator scripts talk to a terminal: printing is their interface, not a stray debug line.
"scripts/**" = ["T20"]
# The engine's runnable example prints its reading; that output is the thing it exists to show.
"packages/promise-graph/examples/**" = ["T20"]
# Evaluation fixtures build hand-written cases and assert on them; a scorer test that could
# not name a variable `S` or shadow a builtin-ish label would be harder to read, not safer.
"evals/tests/**" = ["N802", "N803", "N806"]
# The simulator's operator screen is a markup template. A CSS rule or a form action wrapped
# to fit a column limit is markup that reads worse and renders the same.
"apps/order-simulator/src/order_simulator/ui.py" = ["E501"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/promise-graph/src",
    "packages/promise-graph",
    "packages/order-contract/src",
    "apps/backend/src",
    "apps/backend/tests",
    "apps/order-simulator/src",
    ".",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# boto3 and botocore ship no py.typed marker. The SDK is imported by exactly one module,
# which wraps the single call it makes behind a Protocol, so the untyped surface is one
# import wide rather than spread through the application.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# jmespath ships no py.typed marker either. It is imported by exactly one test, which runs the
# release guard's own query over a recorded change set, and the value it returns is compared
# against a list of logical resource ids -- so the untyped surface is one call wide.
[[tool.mypy.overrides]]
module = ["jmespath.*"]
ignore_missing_imports = true

# The OpenAI SDK does ship `py.typed`, and this override is not about its types: it is an
# evaluation-group dependency, so the job that type-checks the backend alone installs none of
# the evaluation tree and would otherwise fail on a missing stub for a module that is deferred
# inside a function body and never imported at runtime there. Where the package is installed --
# the evaluation job, which type-checks `evals` and `scripts` -- its real annotations are used.
[[tool.mypy.overrides]]
module = ["openai.*"]
ignore_missing_imports = true

# DeepEval ships a `py.typed` marker but its public surface is loosely annotated: the metric
# base class takes `*args, **kwargs` and several attributes are untyped. It is imported by one
# module, the adapter, which is the only place in the repository that knows the framework
# exists.
[[tool.mypy.overrides]]
module = "deepeval.*"
ignore_errors = true

# Subclassing DeepEval's metric base calls its untyped `__init_subclass__`, which is a hook of
# the framework rather than anything PromisePatch wrote. The adapter is the only module that
# subclasses it, and everything the metrics decide is a call out to typed functions in
# `evals.metrics`.
[[tool.mypy.overrides]]
module = "evals.metrics.deepeval_adapter"
disable_error_code = ["no-untyped-call"]

# `with_local_env.py` is run as a path script, so its sibling is importable by bare name at
# runtime. mypy resolves modules by name rather than by how a file will be invoked, and the two
# operator scripts predate this directory becoming a package; the composition root beside them is
# checked normally.
[[tool.mypy.overrides]]
module = "bootstrap_local_env"
ignore_missing_imports = true

# asyncpg ships no py.typed marker. The driver is used directly only by the event listener,
# which wraps it behind a Protocol naming the four calls it makes, so the untyped surface is
# one import wide rather than spread through the application.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "packages/promise-graph/tests",
    "packages/order-contract/tests",
    "apps/order-simulator/tests",
    "apps/backend/tests",
    "evals/tests",
    "scripts/tests",
]
pythonpath = ["packages/promise-graph", "apps/backend/tests", "apps/order-simulator/tests", "."]
addopts = "-q --strict-markers --strict-config --import-mode=importlib -m 'not bedrock_live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "property: Hypothesis property-based invariant tests",
    "integration: needs a live PostgreSQL database (PP_MIGRATION_DATABASE_URL)",
    "bedrock_live: calls Amazon Bedrock for real; deselected by default, opt in with -m",
]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["evals", "order_contract", "order_simulator", "promise_graph", "promisepatch"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------- import-linter

[tool.importlinter]
root_packages = ["evals", "order_contract", "order_simulator", "promise_graph", "promisepatch"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "promise_graph module layering"
type = "layers"
layers = [
    "promise_graph.examples",
    "promise_graph.evidence",
    "promise_graph.revalidation",
    "promise_graph.fingerprint",
    "promise_graph.classification",
    "promise_graph.options",
    "promise_graph.propagation",
    "promise_graph.availability",
    "promise_graph.snapshot",
    "promise_graph.model",
]

[[tool.importlinter.contracts]]
name = "promise_graph is free of I/O, infrastructure and nondeterminism"
type = "forbidden"
source_modules = ["promise_graph"]
forbidden_modules = [
    "asyncio",
    "logging",
    "os",
    "pathlib",
    "promisepatch",
    "random",
    "socket",
    "subprocess",
    "urllib",
]

[[tool.importlinter.contracts]]
name = "promisepatch module layering"
type = "layers"
layers = [
    "promisepatch.cli",
    "promisepatch.mcp_server",
    "promisepatch.main",
    "promisepatch.worker",
    "promisepatch.api",
    "promisepatch.orchestrator",
    "promisepatch.mcp",
    "promisepatch.runtime_identity",
    "promisepatch.integrations",
    "promisepatch.demo_restore",
    "promisepatch.provisioning",
    "promisepatch.domain",
    "promisepatch.semantic",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "promisepatch.db",
    "promisepatch.observability",
    "promisepatch.config",
]

# MCP is a transport and a delegation, never a second place where authority lives. The tool
# process reaches a case the way any other client would -- an authenticated HTTP call to the
# intent API -- and this contract is what makes that a fact rather than an intention. Without
# it, the first inconvenient round trip becomes "just read the row here", and the boundary the
# whole conversational authority argument rests on would exist only in a paragraph.
[[tool.importlinter.contracts]]
name = "the MCP surface reaches a case only over HTTP"
type = "forbidden"
source_modules = ["promisepatch.mcp"]
forbidden_modules = [
    "alembic",
    "boto3",
    "botocore",
    "fastapi",
    "promise_graph",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "promisepatch.semantic",
    "sqlalchemy",
]

# The orchestrator is a client, and this is what makes that structural rather than described.
# It cannot import the domain, the database, the API package, the engine or SQLAlchemy, and it
# cannot import the MCP server's own internals either -- so it has no way to reach a case except
# by calling a tool over the real transport with a credential, exactly as a third-party client
# would. Everything a model can cause through it is therefore something an unrelated client
# could already cause, which is the whole authority argument for putting a model in the loop.
#
# `promisepatch.mcp.envelope` is deliberately not forbidden: the refusal vocabulary is a wire
# contract a client has to be able to read, and it is values only. The two modules that hold the
# server and its engine hop are named instead.
# `allow_indirect_imports` because the semantic contracts the loop depends on declare their
# vocabulary in terms of the engine's own exception categories, so the *type* it imports lives
# on a path that reaches `promise_graph`. The contract therefore says exactly one thing and says
# it honestly: no module in this package names the domain, the database, the API, the engine or
# an SDK itself, and therefore none of them can call one.
[[tool.importlinter.contracts]]
name = "the orchestrator reaches a case only as a client"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["promisepatch.orchestrator"]
forbidden_modules = [
    "alembic",
    "boto3",
    "botocore",
    "fastapi",
    "promise_graph",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "promisepatch.integrations",
    "promisepatch.mcp.engine",
    "promisepatch.mcp.server",
    "sqlalchemy",
    "starlette",
]

# Which verb a phase permits, whether a worker said yes, and what a refusal sounds like are all
# decided by values. No socket, no client, no provider, no clock, no environment: a policy that
# could reach one of those could decide differently on two runs of the same conversation, and
# the confirmation gate in particular has to be a function of what the worker actually said.
# `allow_indirect_imports` for the same reason and with the same honesty as the contract above:
# the phase and verb vocabularies are declared beside contracts that carry a due date, so
# `datetime` is on the import path of a module that never reads a clock. What is asserted is that
# `policy` itself imports no clock, no socket, no client and no provider -- so a phase, a
# permission and a worker's yes are functions of their arguments.
[[tool.importlinter.contracts]]
name = "the conversation policy decides without doing"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["promisepatch.orchestrator.policy"]
forbidden_modules = [
    "asyncio",
    "datetime",
    "httpx2",
    "logging",
    "mcp",
    "os",
    "promisepatch.orchestrator.loop",
    "promisepatch.orchestrator.surface",
    "random",
    "socket",
    "subprocess",
    "time",
    "urllib",
]

# What a case currently *is* has one implementation, in the engine and the workflow. This module
# renames its conclusions into the words a person hears; it may not reach a row and quietly grow
# a second one. A projection that could query would eventually disagree with the ladder it was
# supposed to be describing, and nothing would say which of them was right about the case in
# front of you.
#
# `allow_indirect_imports` because the projection's *input type* is declared beside the read
# service that produces it, and that module does hold a query. So this contract says exactly
# one thing, and says it honestly: `status_view` itself imports no database, no framework, no
# clock and no environment, and therefore cannot execute any of them. It does not claim that
# nothing on its import path can.
[[tool.importlinter.contracts]]
name = "the status projection describes and cannot decide"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["promisepatch.domain.status_view"]
forbidden_modules = [
    "asyncio",
    "boto3",
    "botocore",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# The path from an exception to a promise was walked once, by the engine, and written down. This
# module reads those rows back and names them; it may not reach a row of its own and quietly
# recompute a traversal, because a chain shown to a judge has to be the chain that happened.
#
# `allow_indirect_imports` for the same reason the status projection has it: the durable path
# rows are declared beside the read service that loads them, and that module does hold a query.
# The claim here is the honest one -- `causal` itself imports no database, no framework, no
# clock and no environment, and therefore cannot execute any of them.
[[tool.importlinter.contracts]]
name = "the causal projection reads the traversal and cannot walk one"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["promisepatch.domain.causal"]
forbidden_modules = [
    "asyncio",
    "boto3",
    "botocore",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# A plan's identity is derived from rows somebody else read, and derived the same way by both
# of its producers. It must therefore be a function of its arguments and nothing else: a module
# that could reach a clock, a row or the environment could mint an identity that differed
# between the read a worker was shown and the check their confirmation is measured against --
# and the whole point of binding a yes to a plan is that those two are the same value.
[[tool.importlinter.contracts]]
name = "a plan identity is derived from its arguments alone"
type = "forbidden"
source_modules = ["promisepatch.domain.plan_identity"]
forbidden_modules = [
    "asyncio",
    "datetime",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "time",
    "urllib",
    "uuid",
]

# The workflow's decisions are made by functions that cannot reach a database, a provider or a
# request. Everything they need is an argument, which is what makes a step's behaviour testable
# without infrastructure -- and what stops "just read the row here" from ever being the easy fix.
[[tool.importlinter.contracts]]
name = "workflow handlers decide without doing"
type = "forbidden"
source_modules = [
    "promisepatch.domain.handlers",
    "promisepatch.domain.model",
    "promisepatch.domain.retry",
]
forbidden_modules = [
    "asyncio",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# The reading of a worker's sentence is decided by values alone. It gets resources, deliveries
# and quantities as arguments and returns a conclusion, so "what did the system understand" is
# answerable without a database -- and "just read the row here" can never be the easy fix in the
# one place where reading a row would let a guess become a settled delivery. `grounding` is in
# the list for the same reason and one more: what a model's reading is worth has to be decidable
# without a model, or the rule that refuses an ungrounded binding could only be reviewed, never
# run.
[[tool.importlinter.contracts]]
name = "physical interpretation decides without doing"
type = "forbidden"
source_modules = [
    "promisepatch.domain.grounding",
    "promisepatch.domain.interpretation",
    "promisepatch.domain.observation",
]
forbidden_modules = [
    "asyncio",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# An explanation describes an outcome that has already been decided, and the projection that
# produces its facts must not be able to decide anything itself. No database, no provider, no
# clock, no environment: every value it emits was computed by the engine and copied. A
# projection that could read a row would be a second implementation of the classification
# ladder, and the two would eventually disagree about the same case with nothing to say which
# was right.
[[tool.importlinter.contracts]]
name = "explanations describe and cannot decide"
type = "forbidden"
source_modules = ["promisepatch.domain.explanations"]
forbidden_modules = [
    "asyncio",
    "boto3",
    "botocore",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.integrations",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# A model may propose; only PromisePatch decides. This is that sentence as a build failure.
# The semantic contracts are values in and values out: no database, no session, no HTTP client,
# no AWS SDK, no clock, no environment. A provider that could open a connection could act on
# what a model said before anything deterministic had looked at it, and the audit ledger would
# record a write nobody authorised. It cannot, so it doesn't.
[[tool.importlinter.contracts]]
name = "the semantic boundary proposes and cannot act"
type = "forbidden"
source_modules = ["promisepatch.semantic"]
forbidden_modules = [
    "alembic",
    "asyncio",
    "boto3",
    "botocore",
    "fastapi",
    "httpx2",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "promisepatch.integrations",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# The vendor is one module wide. Everything that authorises anything depends on the semantic
# port and its contracts, never on the SDK behind them -- so which model runs this, and whether
# there is a model at all, stays a configuration question.
[[tool.importlinter.contracts]]
name = "authority never depends on an AWS SDK"
type = "forbidden"
source_modules = [
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.graph",
    "promisepatch.semantic",
    "promise_graph",
]
forbidden_modules = ["boto3", "botocore"]

# The same rule for the second vendor, stated separately because it protects a second boundary
# and one list would hide which. An OpenAI adapter exists so a challenger can be measured; it
# is one module wide, and nothing that decides anything -- a consent rule, a physical fact, a
# recovery, the engine -- may import the SDK behind it. The evaluation harness is in the source
# list too: its own contract already forbids `promisepatch.integrations`, and this closes the
# other way in, so the only thing that can construct an OpenAI client is a composition root
# that has to be handed an authorisation and a key.
[[tool.importlinter.contracts]]
name = "authority never depends on an OpenAI SDK"
type = "forbidden"
source_modules = [
    "evals",
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.graph",
    "promisepatch.semantic",
    "promise_graph",
]
forbidden_modules = ["openai"]

[[tool.importlinter.contracts]]
name = "semantic module layering"
type = "layers"
layers = [
    "promisepatch.semantic.fake",
    "promisepatch.semantic.provider",
    "promisepatch.semantic.jobs",
    "promisepatch.semantic.prompts",
    "promisepatch.semantic.contracts",
    "promisepatch.semantic.errors",
]

[[tool.importlinter.contracts]]
name = "the engine never learns about the application"
type = "forbidden"
source_modules = ["promise_graph"]
forbidden_modules = ["promisepatch", "sqlalchemy"]

# Consent is read from the customer's own words and nothing else. The literal parser and the
# message it answers are values in, values out: no database, no provider, no model, no clock.
# That is what makes "only a literal reply authorises a change" checkable rather than reviewed --
# and what stops "just look up the request here" from ever being the easy fix in the one place
# where looking something up could turn a sentence into a signature.
# A possession link opens a page; it never decides anything, and this is what keeps it that
# way. The module that mints and verifies one holds no database, no clock, no HTTP framework and
# -- above all -- no parser: a link cannot be made to read an answer, only to name the question.
# Banning `promisepatch.domain.consent` here is the important line. Without it, the shortest
# path to "the link says yes" is an import, and possession of a URL would have become consent.
[[tool.importlinter.contracts]]
name = "a possession link names a request and decides nothing"
type = "forbidden"
source_modules = ["promisepatch.domain.customer_link"]
forbidden_modules = [
    "asyncio",
    "datetime",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain.approvals",
    "promisepatch.domain.consent",
    "promisepatch.main",
    "promisepatch.semantic",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "time",
    "urllib",
]

[[tool.importlinter.contracts]]
name = "consent is decided by literal text alone"
