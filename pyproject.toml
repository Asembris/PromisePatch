[project]
name = "promisepatch-workspace"
version = "0.0.0"
description = "PromisePatch monorepo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["promise-graph"]

[tool.uv]
package = false
native-tls = true

[tool.uv.workspace]
members = ["packages/promise-graph"]

[tool.uv.sources]
promise-graph = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/promise-graph/src", "packages/promise-graph"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "SIM", "RET", "T20", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"packages/promise-graph/tests/**" = ["N802", "N803", "N806"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/promise-graph/src", "packages/promise-graph"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/promise-graph/tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["property: Hypothesis property-based invariant tests"]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["promise_graph"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------- import-linter

[tool.importlinter]
root_packages = ["promise_graph"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "promise_graph module layering"
type = "layers"
layers = [
    "promise_graph.evidence",
    "promise_graph.revalidation",
    "promise_graph.fingerprint",
    "promise_graph.classification",
    "promise_graph.options",
    "promise_graph.propagation",
    "promise_graph.availability",
    "promise_graph.snapshot",
    "promise_graph.model",
]

[[tool.importlinter.contracts]]
name = "promise_graph is free of I/O, infrastructure and nondeterminism"
type = "forbidden"
source_modules = ["promise_graph"]
forbidden_modules = [
    "asyncio",
    "logging",
    "os",
    "pathlib",
    "random",
    "socket",
    "subprocess",
    "urllib",
]
