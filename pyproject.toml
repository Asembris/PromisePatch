[project]
name = "promisepatch-workspace"
version = "0.0.0"
description = "PromisePatch monorepo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["order-contract", "order-simulator", "promise-graph", "promisepatch"]

[tool.uv]
package = false
native-tls = true

[tool.uv.workspace]
members = [
    "packages/promise-graph",
    "packages/order-contract",
    "apps/backend",
    "apps/order-simulator",
]

[tool.uv.sources]
order-contract = { workspace = true }
order-simulator = { workspace = true }
promise-graph = { workspace = true }
promisepatch = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "httpx2>=2.0,<3",
    "pytest-asyncio>=0.24,<1",
]

# Evaluation only, and deliberately its own group rather than part of `dev`. It is not a default
# group, so an ordinary `uv sync` does not install it, the production image (`--no-dev`) cannot
# reach it, and the CI jobs that test the application carry none of its dependency tree. The two
# jobs that need it -- the evaluation suite and import-linter -- ask for it by name.
evals = [
    "deepeval>=4.2,<5",
]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/promise-graph/src",
    "packages/promise-graph",
    "packages/order-contract/src",
    "packages/order-contract",
    "apps/backend/src",
    "apps/order-simulator/src",
    "apps/order-simulator",
    "evals",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "SIM", "RET", "T20", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"packages/promise-graph/tests/**" = ["N802", "N803", "N806"]
# Migration bodies are generated SQL text: a CHECK listing twelve rule ids cannot be
# wrapped without changing the statement it emits.
"apps/backend/alembic/versions/**" = ["E501"]
# Operator scripts talk to a terminal: printing is their interface, not a stray debug line.
"scripts/**" = ["T20"]
# Evaluation fixtures build hand-written cases and assert on them; a scorer test that could
# not name a variable `S` or shadow a builtin-ish label would be harder to read, not safer.
"evals/tests/**" = ["N802", "N803", "N806"]
# The simulator's operator screen is a markup template. A CSS rule or a form action wrapped
# to fit a column limit is markup that reads worse and renders the same.
"apps/order-simulator/src/order_simulator/ui.py" = ["E501"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/promise-graph/src",
    "packages/promise-graph",
    "packages/order-contract/src",
    "apps/backend/src",
    "apps/backend/tests",
    "apps/order-simulator/src",
    ".",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# boto3 and botocore ship no py.typed marker. The SDK is imported by exactly one module,
# which wraps the single call it makes behind a Protocol, so the untyped surface is one
# import wide rather than spread through the application.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# DeepEval ships a `py.typed` marker but its public surface is loosely annotated: the metric
# base class takes `*args, **kwargs` and several attributes are untyped. It is imported by one
# module, the adapter, which is the only place in the repository that knows the framework
# exists.
[[tool.mypy.overrides]]
module = "deepeval.*"
ignore_errors = true

# Subclassing DeepEval's metric base calls its untyped `__init_subclass__`, which is a hook of
# the framework rather than anything PromisePatch wrote. The adapter is the only module that
# subclasses it, and everything the metrics decide is a call out to typed functions in
# `evals.metrics`.
[[tool.mypy.overrides]]
module = "evals.metrics.deepeval_adapter"
disable_error_code = ["no-untyped-call"]

# asyncpg ships no py.typed marker. The driver is used directly only by the event listener,
# which wraps it behind a Protocol naming the four calls it makes, so the untyped surface is
# one import wide rather than spread through the application.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "packages/promise-graph/tests",
    "packages/order-contract/tests",
    "apps/order-simulator/tests",
    "apps/backend/tests",
    "evals/tests",
]
pythonpath = ["packages/promise-graph", "apps/backend/tests", "apps/order-simulator/tests", "."]
addopts = "-q --strict-markers --strict-config --import-mode=importlib -m 'not bedrock_live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "property: Hypothesis property-based invariant tests",
    "integration: needs a live PostgreSQL database (PP_MIGRATION_DATABASE_URL)",
    "bedrock_live: calls Amazon Bedrock for real; deselected by default, opt in with -m",
]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["evals", "order_contract", "order_simulator", "promise_graph", "promisepatch"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------- import-linter

[tool.importlinter]
root_packages = ["evals", "order_contract", "order_simulator", "promise_graph", "promisepatch"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "promise_graph module layering"
type = "layers"
layers = [
    "promise_graph.examples",
    "promise_graph.evidence",
    "promise_graph.revalidation",
    "promise_graph.fingerprint",
    "promise_graph.classification",
    "promise_graph.options",
    "promise_graph.propagation",
    "promise_graph.availability",
    "promise_graph.snapshot",
    "promise_graph.model",
]

[[tool.importlinter.contracts]]
name = "promise_graph is free of I/O, infrastructure and nondeterminism"
type = "forbidden"
source_modules = ["promise_graph"]
forbidden_modules = [
    "asyncio",
    "logging",
    "os",
    "pathlib",
    "promisepatch",
    "random",
    "socket",
    "subprocess",
    "urllib",
]

[[tool.importlinter.contracts]]
name = "promisepatch module layering"
type = "layers"
layers = [
    "promisepatch.cli",
    "promisepatch.main",
    "promisepatch.worker",
    "promisepatch.api",
    "promisepatch.integrations",
    "promisepatch.domain",
    "promisepatch.semantic",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "promisepatch.db",
    "promisepatch.observability",
    "promisepatch.config",
]

# The workflow's decisions are made by functions that cannot reach a database, a provider or a
# request. Everything they need is an argument, which is what makes a step's behaviour testable
# without infrastructure -- and what stops "just read the row here" from ever being the easy fix.
[[tool.importlinter.contracts]]
name = "workflow handlers decide without doing"
type = "forbidden"
source_modules = [
    "promisepatch.domain.handlers",
    "promisepatch.domain.model",
    "promisepatch.domain.retry",
]
forbidden_modules = [
    "asyncio",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# The reading of a worker's sentence is decided by values alone. It gets resources, deliveries
# and quantities as arguments and returns a conclusion, so "what did the system understand" is
# answerable without a database -- and "just read the row here" can never be the easy fix in the
# one place where reading a row would let a guess become a settled delivery. `grounding` is in
# the list for the same reason and one more: what a model's reading is worth has to be decidable
# without a model, or the rule that refuses an ungrounded binding could only be reviewed, never
# run.
[[tool.importlinter.contracts]]
name = "physical interpretation decides without doing"
type = "forbidden"
source_modules = [
    "promisepatch.domain.grounding",
    "promisepatch.domain.interpretation",
    "promisepatch.domain.observation",
]
forbidden_modules = [
    "asyncio",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# A model may propose; only PromisePatch decides. This is that sentence as a build failure.
# The semantic contracts are values in and values out: no database, no session, no HTTP client,
# no AWS SDK, no clock, no environment. A provider that could open a connection could act on
# what a model said before anything deterministic had looked at it, and the audit ledger would
# record a write nobody authorised. It cannot, so it doesn't.
[[tool.importlinter.contracts]]
name = "the semantic boundary proposes and cannot act"
type = "forbidden"
source_modules = ["promisepatch.semantic"]
forbidden_modules = [
    "alembic",
    "asyncio",
    "boto3",
    "botocore",
    "fastapi",
    "httpx2",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "promisepatch.integrations",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# The vendor is one module wide. Everything that authorises anything depends on the semantic
# port and its contracts, never on the SDK behind them -- so which model runs this, and whether
# there is a model at all, stays a configuration question.
[[tool.importlinter.contracts]]
name = "authority never depends on an AWS SDK"
type = "forbidden"
source_modules = [
    "promisepatch.db",
    "promisepatch.domain",
    "promisepatch.graph",
    "promisepatch.semantic",
    "promise_graph",
]
forbidden_modules = ["boto3", "botocore"]

[[tool.importlinter.contracts]]
name = "semantic module layering"
type = "layers"
layers = [
    "promisepatch.semantic.fake",
    "promisepatch.semantic.provider",
    "promisepatch.semantic.jobs",
    "promisepatch.semantic.prompts",
    "promisepatch.semantic.contracts",
    "promisepatch.semantic.errors",
]

[[tool.importlinter.contracts]]
name = "the engine never learns about the application"
type = "forbidden"
source_modules = ["promise_graph"]
forbidden_modules = ["promisepatch", "sqlalchemy"]

# Consent is read from the customer's own words and nothing else. The literal parser and the
# message it answers are values in, values out: no database, no provider, no model, no clock.
# That is what makes "only a literal reply authorises a change" checkable rather than reviewed --
# and what stops "just look up the request here" from ever being the easy fix in the one place
# where looking something up could turn a sentence into a signature.
[[tool.importlinter.contracts]]
name = "consent is decided by literal text alone"
type = "forbidden"
source_modules = [
    "promisepatch.domain.consent",
    "promisepatch.domain.messaging",
]
forbidden_modules = [
    "asyncio",
    "fastapi",
    "logging",
    "os",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.domain.approvals",
    "promisepatch.main",
    "random",
    "socket",
    "sqlalchemy",
    "starlette",
    "subprocess",
    "urllib",
]

# The module that can ask a model what a customer's sentence looked like does not hold the
# parser that reads a literal yes. Direct imports only, and deliberately so: the step ledger
# reaches every executor, so a whole-graph ban would say nothing about any module in the domain.
# What this does say is that `customer_intent` names no parser and no decision, which -- with
# the source assertions in `test_customer_intent` -- is the two halves of "the model understands;
# the deterministic protocol authorizes" written where a build can check them.
[[tool.importlinter.contracts]]
name = "apparent intent does not hold the literal parser"
type = "forbidden"
source_modules = ["promisepatch.domain.customer_intent"]
forbidden_modules = ["promisepatch.domain.consent"]
allow_indirect_imports = true

# The order system is a different system, and this is what makes that structural rather than
# stated. It cannot import PromisePatch, cannot import PromisePatch's engine, and holds no
# SQLAlchemy model or Alembic revision: its storage is its own SQLite file and nothing else.
[[tool.importlinter.contracts]]
name = "the order system never learns about PromisePatch"
type = "forbidden"
source_modules = ["order_simulator"]
forbidden_modules = ["alembic", "promise_graph", "promisepatch", "sqlalchemy"]

# The wire contract is shared by both sides, so it must belong to neither. It is Pydantic and
# the standard library: no application, no database, no HTTP client. Anything else here would
# make importing the contract mean importing one side's implementation.
[[tool.importlinter.contracts]]
name = "the contract belongs to neither application"
type = "forbidden"
source_modules = ["order_contract"]
forbidden_modules = [
    "fastapi",
    "httpx2",
    "order_simulator",
    "promise_graph",
    "promisepatch",
    "sqlalchemy",
    "starlette",
]

# An adapter reaches another system; it must not be able to reach ours. This is the structural
# half of Proof A: an outbound amendment cannot quietly write PromisePatch's own copy of the
# order it just asked somebody else to change, because the module that sends it holds no
# database handle and no model it could write one with. The mirror moves in
# `promisepatch.domain.order_mirror`, on the strength of an event or an authoritative read.
[[tool.importlinter.contracts]]
name = "an outbound adapter cannot write the mirror"
type = "forbidden"
source_modules = ["promisepatch.integrations"]
forbidden_modules = [
    "alembic",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.fixtures",
    "promisepatch.graph",
    "sqlalchemy",
]

# Measurement never becomes production. The application, the engine, the wire contract and the
# order system cannot reach the evaluation package or the framework behind it -- so an eval that
# could change what it measures is not something to be careful about, it is something that does
# not compile. The dependency also stays where it belongs: `deepeval` is an eval-only group, and
# nothing in the runtime image can import it even if it were installed.
[[tool.importlinter.contracts]]
name = "measurement never becomes production"
type = "forbidden"
source_modules = ["order_contract", "order_simulator", "promise_graph", "promisepatch"]
forbidden_modules = ["deepeval", "evals"]

# The harness cannot reach a model, a database or the network. An evaluation is the one workload
# here that could deliberately spend money at scale, so "the offline runner cannot call Bedrock"
# is a build failure rather than a policy: there is no AWS SDK, no HTTP client, no session and no
# migration in its import graph, and the only provider it can construct is the deterministic fake.
[[tool.importlinter.contracts]]
name = "the evaluation harness cannot reach a model or a database"
type = "forbidden"
source_modules = ["evals"]
forbidden_modules = [
    "alembic",
    "boto3",
    "botocore",
    "fastapi",
    "httpx2",
    "promisepatch.api",
    "promisepatch.db",
    "promisepatch.integrations",
    "promisepatch.main",
    "promisepatch.worker",
    "socket",
    "sqlalchemy",
    "starlette",
    "urllib",
]

# The framework is one module wide. The dataset, the metrics, the runner, the thresholds and the
# report are ordinary Python that runs without DeepEval installed -- which is what makes every
# number this evaluation produces reproducible by hand, and what stops a runner from quietly
# becoming the source of truth.
[[tool.importlinter.contracts]]
name = "DeepEval is one module wide"
type = "forbidden"
source_modules = [
    "evals.budget",
    "evals.cases",
    "evals.context",
    "evals.dataset",
    "evals.metrics.customer",
    "evals.metrics.verdict",
    "evals.metrics.worker",
    "evals.observed",
    "evals.prompts",
    "evals.report",
    "evals.results",
    "evals.runner",
    "evals.summary",
    "evals.thresholds",
]
forbidden_modules = ["deepeval"]

[[tool.importlinter.contracts]]
name = "evaluation module layering"
type = "layers"
layers = [
    "evals.report",
    "evals.summary",
    "evals.runner",
    "evals.dataset",
    "evals.metrics",
    "evals.observed",
    "evals.cases",
    "evals.context",
]
